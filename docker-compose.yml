services:
  postgres:
    image: postgres:16
    container_name: denial-recovery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: denial_recovery
    ports:
      - "5432:5432"
    volumes:
      - denial_pgdata:/var/lib/postgresql/data
volumes:
  denial_pgdata:
